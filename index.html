<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onycs Labs</title>
    <meta
      name="description"
      content="Onycs Labs — a new website is coming soon."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #09090b;
        color: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        max-width: 42rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 7rem);
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      p {
        margin: 1.5rem 0 0;
        color: #a1a1aa;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Onycs Labs</h1>
      <p>A new website is coming soon.</p>
    </main>
  </body>
</html>
